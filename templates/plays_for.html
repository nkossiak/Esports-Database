{% extends 'base.html' %}
{% block content %}

<div class="page-header">
    <h2>Player Assignments</h2>
    <span class="page-chip">Relationship Mapping</span>
</div>

<form method="POST">
    <div class="input-row">
        <select name="player_id" required>
            <option value="">Select Player</option>
            {% for player in players %}
            <option value="{{ player.NodeID }}">{{ player.Name }}</option>
            {% endfor %}
        </select>

        <select name="team_id" required>
            <option value="">Select Team</option>
            {% for team in teams %}
            <option value="{{ team.NodeID }}">{{ team.Name }}</option>
            {% endfor %}
        </select>
    </div>
    
    <button type="submit">Connect Player to Team</button>
</form>

<hr style="border: 0; border-top: 1px solid var(--line); margin: 24px 0;">

<table>
    <thead>
        <tr>
            <th>EdgeID</th>
            <th>Player</th>
            <th>Team</th>
        </tr>
    </thead>
    <tbody>
        {% for row in rows %}
        <tr>
            <td>{{ row.EdgeID }}</td>
            <td><strong>{{ row.player_name }}</strong></td>
            <td>{{ row.team_name }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
